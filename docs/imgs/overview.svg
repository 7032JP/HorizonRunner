<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 300" width="740">
  <rect x="0" y="0" width="740" height="300" fill="#ffffff"/>
  <!-- メイン CPU -->
  <rect x="30" y="30" width="320" height="222" fill="#e3f2fd" stroke="#1565c0"/>
  <text x="45" y="55" font-family="sans-serif" font-size="15" fill="#1565c0">メイン CPU (本体 $0400-)</text>
  <rect x="45" y="68" width="300" height="24" fill="#ffffff" stroke="#888888"/>
  <text x="52" y="85" font-family="sans-serif" font-size="12" fill="#333333">c_main.c — ゲームの本体 (進行と当たり判定)</text>
  <rect x="45" y="98" width="300" height="36" fill="#ffffff" stroke="#888888"/>
  <text x="52" y="112" font-family="sans-serif" font-size="12" fill="#333333">c_subprog.c — 固定パラメータ 8 byte と</text>
  <text x="52" y="128" font-family="sans-serif" font-size="12" fill="#333333">描画コマンドのキュー 108 byte</text>
  <rect x="45" y="140" width="300" height="24" fill="#ffffff" stroke="#888888"/>
  <text x="52" y="157" font-family="sans-serif" font-size="12" fill="#333333">asm_test.s / asm_subsys.s — HALT と TEST</text>
  <rect x="45" y="170" width="300" height="24" fill="#ffffff" stroke="#888888"/>
  <text x="52" y="187" font-family="sans-serif" font-size="12" fill="#333333">asm_timer.s / asm_input.s — IRQ (タイマ・キー)</text>
  <rect x="45" y="200" width="300" height="24" fill="#ffffff" stroke="#888888"/>
  <text x="52" y="217" font-family="sans-serif" font-size="12" fill="#333333">c_sound.c (PSG) / c_text.c (文字)</text>
  <!-- 共有 RAM -->
  <line x1="350" y1="120" x2="400" y2="120" stroke="#333333" marker-end="url(#a6)"/>
  <line x1="400" y1="150" x2="350" y2="150" stroke="#333333" marker-end="url(#a6)"/>
  <rect x="400" y="95" width="120" height="80" fill="#fffde7" stroke="#795548"/>
  <text x="418" y="120" font-family="sans-serif" font-size="14" fill="#333333">共有 RAM</text>
  <text x="408" y="140" font-family="sans-serif" font-size="12" fill="#666666">128 byte</text>
  <text x="408" y="158" font-family="sans-serif" font-size="12" fill="#666666">$FC80- / $D380-</text>
  <line x1="520" y1="120" x2="590" y2="120" stroke="#333333" marker-end="url(#a6)"/>
  <line x1="590" y1="150" x2="520" y2="150" stroke="#333333" marker-end="url(#a6)"/>
  <!-- サブ CPU -->
  <rect x="590" y="30" width="140" height="222" fill="#fde8e8" stroke="#c62828"/>
  <text x="600" y="55" font-family="sans-serif" font-size="15" fill="#c62828">サブ CPU</text>
  <rect x="600" y="68" width="120" height="54" fill="#ffffff" stroke="#888888"/>
  <text x="606" y="85" font-family="sans-serif" font-size="12" fill="#333333">asm_subprog.s</text>
  <text x="606" y="101" font-family="sans-serif" font-size="12" fill="#333333">描画プログラム</text>
  <text x="606" y="117" font-family="sans-serif" font-size="12" fill="#666666">$C100-</text>
  <rect x="600" y="130" width="120" height="54" fill="#ffffff" stroke="#888888"/>
  <text x="606" y="147" font-family="sans-serif" font-size="12" fill="#333333">VRAM 48 KB</text>
  <text x="606" y="163" font-family="sans-serif" font-size="12" fill="#333333">B / R / G</text>
  <text x="606" y="179" font-family="sans-serif" font-size="12" fill="#666666">$0000-$BFFF</text>
  <rect x="600" y="192" width="120" height="36" fill="#ffffff" stroke="#888888"/>
  <text x="606" y="208" font-family="sans-serif" font-size="12" fill="#333333">サブシステム ROM</text>
  <text x="606" y="222" font-family="sans-serif" font-size="12" fill="#666666">(キー走査・TEST)</text>
  <text x="30" y="275" font-family="sans-serif" font-size="13" fill="#b71c1c">描画については、メイン側は計算とコマンド作りを行い、VRAM に触るのはサブ側の描画プログラムだけである。</text>
  <defs><marker id="a6" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#333333"/></marker></defs>
</svg>
