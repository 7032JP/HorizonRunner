<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 260" width="740">
  <rect x="0" y="0" width="740" height="260" fill="#ffffff"/>
  <!-- 画面全体 640x200 → 560x175 で描く -->
  <rect x="60" y="30" width="560" height="175" fill="#111111" stroke="#333333"/>
  <text x="60" y="22" font-family="sans-serif" font-size="14" fill="#333333">画面全体 640x200</text>
  <!-- HUD -->
  <!-- 見出しは G プレーンの line 40 (y=30+35)、byte 16 / 36 / 56 (x=60+112 / 60+252 / 60+392) -->
  <text x="172" y="71" font-family="monospace" font-size="11" fill="#4caf50">SCORE 000000</text>
  <text x="312" y="71" font-family="monospace" font-size="11" fill="#4caf50">HI 000000</text>
  <text x="452" y="71" font-family="monospace" font-size="11" fill="#4caf50">REST 5</text>
  <!-- 描画フレーム 384x96 → 336x84 (縮尺 0.875)。左上は line52/byte16 (= dot 128) → x=60+112, y=30+45.5 -->
  <rect x="172" y="75.5" width="336" height="84" fill="#000000" stroke="#ffb300" stroke-width="2"/>
  <text x="180" y="92" font-family="sans-serif" font-size="14" fill="#ffb300">描画フレーム 384x96</text>
  <text x="180" y="108" font-family="sans-serif" font-size="12" fill="#ffd54f">毎フレーム描くのはここだけ</text>
  <!-- 床の縞 -->
  <rect x="172" y="120" width="336" height="4" fill="#2e7d32"/>
  <rect x="172" y="130" width="336" height="5" fill="#43a047"/>
  <rect x="172" y="141" width="336" height="7" fill="#2e7d32"/>
  <rect x="172" y="151" width="336" height="8" fill="#43a047"/>
  <!-- 自機 -->
  <rect x="400" y="104" width="16" height="10" fill="#ffffff"/>
  <text x="120" y="235" font-family="sans-serif" font-size="13" fill="#333333">描画フレームの外 (得点・残機) には毎フレームの描画が来ない = 一度書けば消えない</text>
  <line x1="150" y1="220" x2="150" y2="70" stroke="#555555" stroke-dasharray="3,3" marker-end="url(#a2)"/>
  <defs><marker id="a2" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#555555"/></marker></defs>
</svg>
