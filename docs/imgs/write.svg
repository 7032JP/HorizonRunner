<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 250" width="740">
  <rect x="0" y="0" width="740" height="250" fill="#ffffff"/>
  <!-- main -->
  <rect x="30" y="40" width="200" height="160" fill="#e3f2fd" stroke="#1565c0"/>
  <text x="45" y="65" font-family="sans-serif" font-size="15" fill="#1565c0">メイン CPU</text>
  <text x="45" y="90" font-family="sans-serif" font-size="13" fill="#333333">コマンドを組む</text>
  <rect x="45" y="100" width="170" height="26" fill="#ffffff" stroke="#888888"/>
  <text x="52" y="118" font-family="sans-serif" font-size="12" fill="#333333">絵のコマンド (OBJS 等)</text>
  <rect x="45" y="132" width="170" height="26" fill="#ffffff" stroke="#888888"/>
  <text x="52" y="150" font-family="sans-serif" font-size="12" fill="#333333">WRITE (生のバイト列)</text>
  <rect x="45" y="164" width="170" height="26" fill="#ffffff" stroke="#888888"/>
  <text x="52" y="182" font-family="sans-serif" font-size="12" fill="#333333">固定パラメータ (8 byte)</text>
  <!-- 共有 RAM -->
  <line x1="230" y1="105" x2="286" y2="105" stroke="#333333" marker-end="url(#a5)"/>
  <rect x="286" y="70" width="168" height="92" fill="#fffde7" stroke="#795548"/>
  <text x="304" y="92" font-family="sans-serif" font-size="14" fill="#333333">共有 RAM</text>
  <text x="298" y="110" font-family="sans-serif" font-size="12" fill="#666666">固定パラメータ 8 byte</text>
  <text x="298" y="124" font-family="sans-serif" font-size="12" fill="#666666">($FC83-$FC8A)</text>
  <text x="298" y="140" font-family="sans-serif" font-size="12" fill="#666666">コマンドキュー 108 byte</text>
  <text x="298" y="154" font-family="sans-serif" font-size="12" fill="#666666">($FC93-$FCFE)</text>
  <!-- sub -->
  <line x1="454" y1="105" x2="510" y2="105" stroke="#333333" marker-end="url(#a5)"/>
  <rect x="510" y="40" width="200" height="160" fill="#fde8e8" stroke="#c62828"/>
  <text x="525" y="65" font-family="sans-serif" font-size="15" fill="#c62828">サブ CPU</text>
  <text x="525" y="90" font-family="sans-serif" font-size="13" fill="#333333">描画プログラムが</text>
  <text x="525" y="108" font-family="sans-serif" font-size="12" fill="#333333">パラメータとコマンドを読んで</text>
  <text x="525" y="126" font-family="sans-serif" font-size="13" fill="#333333">VRAM へ書く</text>
  <text x="525" y="155" font-family="sans-serif" font-size="12" fill="#666666">(自分のアドレス空間にある)</text>
  <text x="30" y="226" font-family="sans-serif" font-size="14" fill="#b71c1c">メイン CPU から VRAM は見えない。VRAM に書くのは常にサブ CPU である。</text>
  <defs><marker id="a5" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#333333"/></marker></defs>
</svg>
